name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` fails on a lockfile that does not match package.json, which is
      # the cheapest possible detector for the drift this repo has had before.
      - run: npm ci

      # One command, every gate: typecheck, the four smoke suites, the pure
      # formatting suite, the build check and the README link check.
      - run: npm run verify
