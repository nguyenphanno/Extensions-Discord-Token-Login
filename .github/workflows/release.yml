name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: package and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Never publish an artifact that has not passed the same gates as `main`.
      - run: npm run verify

      # `npm run pack` builds dist/ and wraps it into a Chrome Web Store ready
      # zip with manifest.json at the archive root.
      - run: npm run pack

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
